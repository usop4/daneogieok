<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz02 - 漢字語（日→韓）</title>
    <script src="quiz01-data.js"></script>
    <script src="quiz02-data.js"></script>
    <link rel="stylesheet" href="quiz-common.css" />
    <script src="quiz-common.js"></script>
  </head>
  <body>
    <div class="wrap">
      <section class="card">
        <div class="hd">
          <div class="row">
            <strong>Quiz02 漢字語（日→韓）</strong>
            <span class="pill" id="statPill">-</span>
          </div>
          <div class="row">
            <button class="btn primary" id="btnNext">次の問題</button>
          </div>
        </div>
        <div class="bd">
          <div class="tableWrap">
            <table class="quiz" id="quizTable" aria-label="quiz table"></table>
          </div>
          <div class="answerPanel" id="answerPanel">
            <div class="feedback" id="answerFeedback"></div>
            <div class="row">
            </div>
          </div>
        </div>
      </section>

      <div class="quiz-nav" aria-label="Quiz navigation">
        <a href="quiz01.html">Quiz01</a>
        <a href="quiz02.html">Quiz02</a>
        <a href="quiz03.html">Quiz03</a>
        <a href="quiz04.html">Quiz04</a>
      </div>
    </div>

    <div id="correctPopup" class="popupOverlay">
      <div class="popupCard ok">
        <div class="popupTitle">正解</div>
        <div class="popupText" id="correctPopupText"></div>
        <button class="btn primary popupBtn" id="btnPopupNext">次の問題</button>
      </div>
    </div>

    <script>
      const $ = quizCommon.$;

      const state = {
        items: [],
        questionOrder: [],
        questionIndex: 0,
        progress: null,
        current: null,
        picked: [],
        activeCol: null,
        score: { ok: 0, ng: 0, total: 0 },
        judging: false,
        awaitingNextKey: false,
        popupVisible: false,
        optionGroups: new Map(),
      };

      function normalizeLine(line){ return quizCommon.normalizeLine(line); }

      function parseCSV(text){
        const items = [];
        const lines = text.split("\n").map(normalizeLine).filter((line) => line.length > 0);
        for (const line of lines){
          if (line.startsWith("#")) continue;
          const idx = line.indexOf(",");
          if (idx === -1) continue;
          const hangul = line.slice(0, idx).trim();
          const kanji = line.slice(idx + 1).trim();
          if (!hangul || !kanji) continue;
          items.push({ hangul, kanji });
        }
        return items;
      }

      function parsePairGroups(text){
        const groups = [];
        const lines = text.split("\n").map(normalizeLine).filter((line) => line.length > 0);
        for (const line of lines){
          const parts = line.split(/\s+/).filter(Boolean);
          if (parts.length > 0) groups.push(parts);
        }
        return groups;
      }

      function buildOptionGroups(groups){
        const map = new Map();
        for (const group of groups){
          for (const ch of group){
            if (!map.has(ch)) map.set(ch, group);
          }
        }
        return map;
      }

      function updateStat(){
        quizCommon.updateStat("#statPill", state.score);
      }

      function resetQuestionOrder(){
        state.questionOrder = state.progress
          ? state.progress.buildQuestionOrder(state.items, "random")
          : shuffle(state.items.map((_, index) => index));
        state.questionIndex = 0;
      }

      function resetQuestionOrderForStartup(){
        state.questionOrder = state.progress
          ? state.progress.buildQuestionOrder(state.items, "startup")
          : shuffle(state.items.map((_, index) => index));
        state.questionIndex = 0;
      }

      function resetQuestionOrderPrioritized(){
        state.questionOrder = state.progress
          ? state.progress.buildQuestionOrder(state.items, "prioritize")
          : shuffle(state.items.map((_, index) => index));
        state.questionIndex = 0;
      }

      function sampleOne(arr){ return quizCommon.sampleOne(arr); }

      function shuffle(arr){ return quizCommon.shuffle(arr); }

      function sortHangulOptions(options){
        return [...options].sort((a, b) => a.localeCompare(b, "ko"));
      }

      function getDisplayedOptions(correctHangul){
        const base = Array.from(state.optionGroups.get(correctHangul) || [correctHangul]);
        if (!base.includes(correctHangul)) base.unshift(correctHangul);
        const unique = Array.from(new Set(base));
        const limited = unique.filter((ch) => ch !== correctHangul).slice(0, 6);
        const opts = [correctHangul, ...limited];
        return sortHangulOptions(opts).slice(0, 7);
      }

      function nextQuestion(){
        hideCorrectPopup();
        if (state.items.length === 0){
          renderEmptyTable("CSVが空です。quiz01-data.js を確認してください。" );
          return;
        }
        if (!state.questionOrder.length || state.questionIndex >= state.questionOrder.length){
          resetQuestionOrder();
        }

        const nextIndex = state.questionOrder[state.questionIndex];
        state.questionIndex += 1;
        state.current = state.items[nextIndex] || null;
        if (!state.current) return;
        state.picked = Array.from(state.current.hangul).map(() => null);
        state.activeCol = 0;
        state.judging = false;
        state.awaitingNextKey = false;
        renderTable();
        hideResult();
      }

      function renderEmptyTable(msg){
        quizCommon.renderEmptyTable("#quizTable", msg);
      }

      function getNextColumn(col){
        const start = col + 1;
        for (let i = start; i < state.picked.length; i++){ if (!state.picked[i]) return i; }
        for (let i = 0; i < col; i++){ if (!state.picked[i]) return i; }
        return col;
      }

      function renderTable(){
        const japaneseChars = Array.from(state.current.kanji);
        const hangulChars = Array.from(state.current.hangul);
        const cols = hangulChars.length;

        let html = "<tr>";
        for (let c = 0; c < cols; c++){
          html += `<td><div class="questionCell">${escapeHtml(japaneseChars[c] || "")}</div></td>`;
        }
        html += "</tr>";

        html += "<tr>";
        for (let c = 0; c < cols; c++){
          const correctHangul = hangulChars[c];
          const opts = getDisplayedOptions(correctHangul);
          const filledOpts = [...opts];
          while (filledOpts.length < 7) filledOpts.push("");
          html += `<td><div class="kanjiStack">${filledOpts.map((k, idx) => {
            if (!k) return `<div class="cellBtn dummy" aria-hidden="true"></div>`;
            return `<button class="cellBtn" data-col="${c}" data-h="${escapeAttr(k)}">${idx + 1}. ${escapeHtml(k)}</button>`;
          }).join("")}</div></td>`;
        }
        html += "</tr>";

        const table = $("#quizTable");
        table.innerHTML = html;

        const updateActiveColumnHighlight = () => {
          table.querySelectorAll(".cellBtn").forEach((b) => b.classList.remove("active"));
          if (state.activeCol === null || state.activeCol === undefined) return;
          table.querySelectorAll(`.cellBtn[data-col="${state.activeCol}"]`).forEach((b) => b.classList.add("active"));
        };

        table.onclick = (e) => {
          const btn = e.target.closest(".cellBtn");
          if (!btn) return;
          const col = Number(btn.dataset.col);
          const ch = btn.dataset.h;
          state.activeCol = col;
          state.picked[col] = ch;
          table.querySelectorAll(`.cellBtn[data-col="${col}"]`).forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          const nextCol = getNextColumn(col);
          state.activeCol = nextCol;
          updateActiveColumnHighlight();
          maybeAutoJudge();
        };

        updateActiveColumnHighlight();
        updateStat();
      }

      function selectOptionByKey(key){
        if (!state.current) return;
        const col = state.activeCol !== null && state.activeCol !== undefined ? state.activeCol : state.picked.findIndex((v) => v === null);
        if (col === -1) return;
        state.activeCol = col;
        const buttons = $("#quizTable").querySelectorAll(`.cellBtn[data-col="${col}"]`);
        const options = Array.from(buttons).map((b) => b.dataset.h);
        const index = key === "0" ? 9 : Number(key) - 1;
        if (!options[index]) return;
        const ch = options[index];
        state.picked[col] = ch;
        buttons.forEach((b) => b.classList.remove("selected"));
        buttons[index].classList.add("selected");
        const nextCol = getNextColumn(col);
        state.activeCol = nextCol;
        $("#quizTable").querySelectorAll(".cellBtn").forEach((b) => b.classList.remove("active"));
        if (state.activeCol !== null && state.activeCol !== undefined) {
          $("#quizTable").querySelectorAll(`.cellBtn[data-col="${state.activeCol}"]`).forEach((b) => b.classList.add("active"));
        }
        maybeAutoJudge();
      }

      function maybeAutoJudge(){
        if (!state.current) return;
        if (state.judging) return;
        if (!state.picked.every((x) => x)) return;
        state.judging = true;
        judgeAnswer();
      }

      function judgeAnswer(){
        const guess = state.picked.join("");
        const correct = state.current.hangul;
        state.score.total += 1;
        if (guess === correct){
          state.score.ok += 1;
          hideResult();
          showCorrectPopup(`${state.current.kanji} = ${correct}`);
          updateStat();
          if (state.progress) {
            state.progress.recordOutcome(state.current, true);
            state.progress.persist();
          }
          state.judging = false;
          state.awaitingNextKey = true;
        } else {
          state.score.ng += 1;
          console.log("[quiz02] 不正解単語:", state.current.hangul);
          showResult(`不正解：${guess} / 正解=${correct}`, "ng");
          updateStat();
          if (state.progress) {
            state.progress.recordOutcome(state.current, false);
            state.progress.persist();
          }
          setTimeout(() => { state.judging = false; }, 50);
        }
      }

      function showResult(text, kind){
        const panel = $("#answerPanel");
        panel.className = "answerPanel " + (kind || "");
        $("#answerFeedback").textContent = text;
      }
      function hideResult(){
        const panel = $("#answerPanel");
        panel.className = "answerPanel";
        $("#answerFeedback").textContent = "";
      }
      function showCorrectPopup(text){
        const popup = $("#correctPopup");
        const popupText = $("#correctPopupText");
        if (!popup || !popupText) return;
        popupText.textContent = text;
        popup.classList.add("show");
        popup.removeAttribute("hidden");
        state.popupVisible = true;
      }
      function hideCorrectPopup(){
        const popup = $("#correctPopup");
        if (!popup) return;
        popup.classList.remove("show");
        popup.hidden = true;
        state.popupVisible = false;
      }

      function init(){
        const items = parseCSV(DEFAULT_CSV);
        state.items = items.slice();
        state.optionGroups = buildOptionGroups(parsePairGroups(PAIR));
        state.progress = quizCommon.createOutcomeProgress({
          storageKey: "quiz02-progress-v1",
          getItemKey: (item) => item?.hangul,
          score: state.score,
          stickyNg: true
        });
        state.progress.load();
        resetQuestionOrderForStartup();
        updateStat();
        nextQuestion();
      }

      $("#btnNext").addEventListener("click", nextQuestion);
      $("#btnPopupNext").addEventListener("click", () => {
        hideCorrectPopup();
        nextQuestion();
      });
      $("#statPill").addEventListener("click", () => {
        if (!state.items.length) return;
        const incorrectWords = state.progress ? state.progress.getIncorrectKeys(state.items) : [];
        console.log("[quiz02] 不正解単語一覧:", incorrectWords);
        if (state.progress) state.progress.resetForStatPill();
        resetQuestionOrderPrioritized();
        updateStat();
        nextQuestion();
      });

      window.addEventListener("keydown", (e) => {
        const target = e.target;
        if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
        if (state.popupVisible && e.key === "Enter") {
          e.preventDefault();
          hideCorrectPopup();
          nextQuestion();
          return;
        }
        if (state.awaitingNextKey) {
          state.awaitingNextKey = false;
          nextQuestion();
          return;
        }
        if (/^[0-9]$/.test(e.key)) {
          e.preventDefault();
          selectOptionByKey(e.key);
          return;
        }
        if (e.key === "Enter") nextQuestion();
      });

      function escapeHtml(s){ return quizCommon.escapeHtml(s); }
      function escapeAttr(s){ return quizCommon.escapeAttr(s); }

      init();
    </script>
  </body>
</html>
