<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz03 - 動詞意味クイズ</title>
    <script src="quiz03-option.js"></script>
    <link rel="stylesheet" href="quiz-common.css" />
    <script src="quiz-common.js"></script>
  </head>
  <body>
    <div class="wrap">
      <section class="card">
        <div class="hd">
          <div class="row">
            <strong>Quiz03 動詞（韓→日）</strong>
            <span class="pill" id="statPill">-</span>
          </div>
          <button class="btn primary" id="nextBtn">次の問題</button>
        </div>
        <div class="bd">
          <div class="question" id="questionText">-</div>
          <div id="choices" class="choices"></div>
          <div class="hint" id="hintText">選択肢を選んでください。</div>
        </div>
      </section>

      <div class="quiz-nav" aria-label="Quiz navigation">
        <a href="quiz01.html">Quiz01</a>
        <a href="quiz02.html">Quiz02</a>
        <a href="quiz03.html">Quiz03</a>
        <a href="quiz04.html">Quiz04</a>
        <a href="quiz-stats.html">Stats</a>
      </div>
    </div>

    <script>
      const state = {
        items: [],
        questionOrder: [],
        questionIndex: 0,
        progress: null,
        current: null,
        answered: false,
        score: { ok: 0, ng: 0, total: 0 }
      };

      function normalizeLine(line) {
        return quizCommon.normalizeLine(line);
      }

      function parseOptionGroups(text) {
        const groups = [];
        const lines = text.split('\n').map(normalizeLine).filter(Boolean);
        let currentGroup = null;

        for (const rawLine of lines) {
          if (rawLine.startsWith('[') && rawLine.endsWith(']')) {
            const name = rawLine.slice(1, -1).trim();
            if (name === 'グループなし') {
              currentGroup = null;
              continue;
            }
            currentGroup = { name, entries: [] };
            groups.push(currentGroup);
            continue;
          }

          if (!currentGroup) continue;
          const parts = rawLine.split(/\s+/, 2);
          if (parts.length < 2) continue;
          const hangul = parts[0].trim();
          const rest = rawLine.slice(hangul.length).trim();
          const values = rest.split(',').map((value) => value.trim()).filter(Boolean);
          if (!hangul || values.length === 0) continue;
          currentGroup.entries.push({ hangul, values });
        }

        return groups;
      }

      function parseEntries(text) {
        const items = [];
        const lines = text.split('\n').map(normalizeLine).filter(Boolean);
        for (const rawLine of lines) {
          if (rawLine.startsWith('#')) continue;
          const parts = rawLine.split(/\s+/, 2);
          if (parts.length < 2) continue;
          const hangul = parts[0].trim();
          const rest = rawLine.slice(hangul.length).trim();
          const values = rest.split(',').map((value) => value.trim()).filter(Boolean);
          if (!hangul || values.length === 0) continue;
          items.push({ hangul, values });
        }
        return items;
      }

      function parseExcludedWords(text) {
        const excludedWords = new Set();
        const lines = text.split('\n').map(normalizeLine).filter(Boolean);
        for (const rawLine of lines) {
          if (rawLine.startsWith('#')) continue;
          const hangul = rawLine.split(/\s+/, 1)[0];
          if (hangul) excludedWords.add(hangul);
        }
        return excludedWords;
      }

      function shuffle(array) {
        return quizCommon.shuffle(array);
      }

      async function loadOptionGroups() {
        if (Array.isArray(window.QUIZ03_OPTION_GROUPS) && window.QUIZ03_OPTION_GROUPS.length) {
          return window.QUIZ03_OPTION_GROUPS;
        }

        try {
          const response = await fetch('quiz03-option.txt');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          const groups = parseOptionGroups(text);
          window.QUIZ03_OPTION_GROUPS = groups;
          return groups;
        } catch (error) {
          console.warn('[quiz03] Failed to load option groups:', error);
          window.QUIZ03_OPTION_GROUPS = [];
          return [];
        }
      }

      async function loadExcludedWords() {
        if (window.QUIZ03_EXCLUDED_WORDS instanceof Set) {
          return window.QUIZ03_EXCLUDED_WORDS;
        }

        try {
          const response = await fetch('quiz03-exclude.txt');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          const excludedWords = parseExcludedWords(text);
          window.QUIZ03_EXCLUDED_WORDS = excludedWords;
          return excludedWords;
        } catch (error) {
          console.warn('[quiz03] Failed to load exclusion words:', error);
          window.QUIZ03_EXCLUDED_WORDS = new Set();
          return window.QUIZ03_EXCLUDED_WORDS;
        }
      }

      function isExcludedWord(word) {
        return window.QUIZ03_EXCLUDED_WORDS instanceof Set && window.QUIZ03_EXCLUDED_WORDS.has(word);
      }

      function getGroupCandidates(item) {
        const groups = Array.isArray(window.QUIZ03_OPTION_GROUPS)
          ? window.QUIZ03_OPTION_GROUPS.filter((group) => Array.isArray(group.entries) && group.entries.some((entry) => entry.hangul === item.hangul))
          : [];

        console.log(`[quiz03] 出題単語: ${item.hangul}`);
        console.log(`[quiz03] 所属グループ:`, groups.map((group) => group.name));
        if (groups.length) {
          console.log(`[quiz03] グループ内単語:`, groups.map((group) => ({
            words: (group.entries || []).map((entry) => entry.hangul)
          })));
        }

        const selected = [];
        const seenKeys = new Set();

        for (const group of groups) {
          const otherEntries = (group.entries || []).filter((entry) => entry.hangul !== item.hangul);
          for (const entry of otherEntries) {
            if (isExcludedWord(entry.hangul)) continue;
            for (const value of entry.values || []) {
              if (!value) continue;
              const key = `${entry.hangul}::${value}`;
              if (seenKeys.has(key)) continue;
              seenKeys.add(key);
              selected.push({ hangul: entry.hangul, value, isCorrect: false });
            }
          }
        }

        return shuffle(selected);
      }

      function pickOptions(item) {
        const correctValue = item.values[Math.floor(Math.random() * item.values.length)];
        const options = [{ hangul: item.hangul, value: correctValue, isCorrect: true }];
        const seenValues = new Set([correctValue]);
        const groupCandidates = getGroupCandidates(item).filter((entry) => !seenValues.has(entry.value));

        const selected = [];
        for (const candidate of groupCandidates) {
          if (selected.length >= 3) break;
          if (seenValues.has(candidate.value)) continue;
          selected.push(candidate);
          seenValues.add(candidate.value);
        }

        const fallbackPool = state.items
          .filter((candidate) => candidate.hangul !== item.hangul)
          .filter((candidate) => !isExcludedWord(candidate.hangul))
          .flatMap((candidate) => candidate.values.map((value) => ({ hangul: candidate.hangul, value })))
          .filter((entry) => !seenValues.has(entry.value));

        const fallback = shuffle(fallbackPool).filter((entry, index, arr) => arr.findIndex((candidate) => candidate.value === entry.value) === index);
        for (const candidate of fallback) {
          if (selected.length >= 3) break;
          if (seenValues.has(candidate.value)) continue;
          selected.push({ hangul: candidate.hangul, value: candidate.value, isCorrect: false });
          seenValues.add(candidate.value);
        }

        return shuffle([...options, ...selected]).slice(0, 4);
      }

      function updateStat() {
        quizCommon.updateStat('#statPill', state.score);
      }

      function resetQuestionOrder(prioritizeOutcomes = false) {
        const mode = prioritizeOutcomes ? 'prioritize' : 'random';
        state.questionOrder = state.progress
          ? state.progress.buildQuestionOrder(state.items, mode)
          : quizCommon.shuffle(state.items.map((_, index) => index));
        state.questionIndex = 0;
      }

      function resetQuestionOrderForStartup() {
        state.questionOrder = state.progress
          ? state.progress.buildQuestionOrder(state.items, 'startup')
          : quizCommon.shuffle(state.items.map((_, index) => index));
        state.questionIndex = 0;
      }

      function recordOutcome(item, isCorrect) {
        if (!state.progress) return;
        state.progress.recordOutcome(item, isCorrect);
      }

      function getIncorrectWords() {
        if (!state.progress) return [];
        return state.progress.getIncorrectKeys(state.items);
      }

      function pickNextQuestion() {
        if (!state.items.length) return null;
        if (!state.questionOrder.length || state.questionIndex >= state.questionOrder.length) {
          resetQuestionOrder();
        }

        const index = state.questionOrder[state.questionIndex];
        state.questionIndex += 1;
        return state.items[index] || null;
      }

      function renderQuestion() {
        if (!state.current) return;
        document.getElementById('questionText').textContent = state.current.hangul;
        const choicesBox = document.getElementById('choices');
        const options = pickOptions(state.current);
        choicesBox.innerHTML = '';
        options.forEach((option) => {
          const btn = document.createElement('button');
          btn.className = 'choice';
          btn.dataset.value = option.value;
          btn.dataset.hangul = option.hangul;
          btn.innerHTML = `<span class="choice-text">${option.value}</span><span class="hangul-label">（${option.hangul}）</span>`;
          btn.addEventListener('click', () => evaluateAnswer(option.value));
          choicesBox.appendChild(btn);
        });
        document.getElementById('hintText').textContent = '選択肢を選んでください。';
        state.answered = false;
        updateStat();
      }

      function evaluateAnswer(selectedValue) {
        if (state.answered || !state.current) return;
        state.answered = true;
        const buttons = Array.from(document.querySelectorAll('.choice'));
        const selectedIsCorrect = state.current.values.includes(selectedValue);
        const correctAnswerText = state.current.values.join(' / ');
        buttons.forEach((btn) => {
          btn.classList.add('locked');
          btn.classList.add('revealed');
          const value = btn.dataset.value;
          const isCorrect = state.current.values.includes(value);
          const isSelected = value === selectedValue;
          if (isCorrect) {
            btn.classList.add('correct');
          }
          if (isSelected && !isCorrect) {
            btn.classList.add('wrong');
          }
        });

        if (selectedIsCorrect) {
          state.score.ok += 1;
          quizCommon.recordDailyQuizOutcome('quiz03', true);
        } else {
          state.score.ng += 1;
          quizCommon.recordDailyQuizOutcome('quiz03', false);
          console.log('[quiz03] 不正解単語:', state.current.hangul);
        }
        state.score.total += 1;
        recordOutcome(state.current, selectedIsCorrect);
        document.getElementById('hintText').textContent = selectedIsCorrect ? '正解です。' : `不正解です。正解は ${correctAnswerText} です。`;
        updateStat();
        if (state.progress) state.progress.persist();

        const correctButton = buttons.find((btn) => state.current.values.includes(btn.dataset.value));
        if (correctButton) {
          correctButton.addEventListener('click', nextQuestion, { once: true });
        }
      }

      function nextQuestion() {
        state.current = pickNextQuestion();
        if (!state.current) return;
        renderQuestion();
      }

      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
      document.getElementById('statPill').addEventListener('click', () => {
        if (!state.items.length) return;
        const incorrectWords = getIncorrectWords();
        console.log('[quiz03] 不正解単語一覧:', incorrectWords);
        resetQuestionOrder(true);
        if (state.progress) state.progress.resetForStatPill({ clearOutcomes: true });
        updateStat();
        nextQuestion();
      });

      document.addEventListener('keydown', (event) => {
        if (!state.current || state.answered) return;
        const key = Number(event.key);
        if (Number.isInteger(key) && key >= 1 && key <= 4) {
          const buttons = Array.from(document.querySelectorAll('.choice'));
          const target = buttons[key - 1];
          if (target) evaluateAnswer(target.dataset.value);
        }
      });

      async function init() {
        try {
          const response = await fetch('quiz03-data.txt');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state.items = parseEntries(await response.text());
        } catch (error) {
          console.error('[quiz03] Failed to load question data:', error);
          document.getElementById('hintText').textContent = '問題データを読み込めませんでした。';
          return;
        }
        if (!state.items.length) {
          document.getElementById('hintText').textContent = 'データがありません。';
          return;
        }
        state.progress = quizCommon.createOutcomeProgress({
          storageKey: 'quiz03-progress-v1',
          getItemKey: (item) => item?.hangul,
          score: state.score,
          stickyNg: true
        });
        state.progress.load();
        await loadOptionGroups();
        await loadExcludedWords();
        resetQuestionOrderForStartup();
        updateStat();
        nextQuestion();
      }

      init();
    </script>
  </body>
</html>
