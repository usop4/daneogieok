    .tableWrap{

<body>
  <header>
    <div>
      <h1>漢字語クイズ（横線なし・自動判定）</h1>
      <div class="sub">ハングルの下に候補漢字を縦積み表示／全列の選択が揃ったら自動で正誤判定</div>
    </div>
    <div class="pill" id="statPill">-</div>
  </header>

  <div class="wrap">
    <!-- Quiz -->
    <section class="card">
      <div class="hd">
        <div class="row">
          <button class="btn primary" id="btnNext">次の問題</button>
          <button class="btn" id="btnReveal">答えを見る</button>
          <button class="btn danger" id="btnResetScore">スコアリセット</button>
        </div>
        <div class="row">
          <span class="kbd">Enter</span><span class="small">次へ</span>
          <span class="kbd">R</span><span class="small">答え</span>
        </div>
      </div>

      <div class="bd">
        <div class="tableWrap">
          <table class="quiz" id="quizTable" aria-label="quiz table"></table>
        </div>

        <div class="answerPanel">
          <div>
            <div class="muted">選択中（列ごと）</div>
            <div class="current" id="currentGuess">（未選択）</div>
          </div>
          <div class="row">
            <span class="small">※全列が埋まると自動で判定します</span>
          </div>
        </div>

        <div id="resultBox" class="result"></div>
      </div>
    </section>

    <!-- CSV -->
    <aside class="card">
      <div class="hd">
        <div>CSV（hangul,meaning）</div>
        <button class="btn" id="btnApplyCsv">CSVを適用</button>
      </div>
      <div class="bd">
        <p class="small">
          形式：<span class="kbd">가각,価格</span> のように1行1語。空行OK。先頭の <span class="kbd">#</span> 行はコメント扱い。
        </p>
        <textarea id="csvInput" spellcheck="false"></textarea>
        <p class="small">
          ※ 辞書は「ハングル1文字 → 候補漢字集合」として内部生成します。
        </p>
      </div>
    </aside>
  </div>

<script>

const $ = (sel) => document.querySelector(sel);

const state = {
  dict: new Map(), // hangulChar -> Set(kanjiChar)
  items: [],       // { hangul, kanji }
  current: null,   // { hangul, kanji }
  picked: [],      // picked kanji per column index
  score: { ok: 0, ng: 0, total: 0 },
  judging: false,  // 自動判定の連打防止
};

function normalizeLine(line){
  return line.replace(/\r/g, "").trim();
}

function parseCSV(text){
  const items = [];
  const lines = text.split("\n").map(normalizeLine).filter(l => l.length > 0);
  for (const line of lines){
    if (line.startsWith("#")) continue;
    const idx = line.indexOf(",");
    if (idx === -1) continue;
    const hangul = line.slice(0, idx).trim();
    const kanji  = line.slice(idx+1).trim();
    if (!hangul || !kanji) continue;
    items.push({ hangul, kanji });
  }
  return items;
}

function buildDict(items){
  const dict = new Map();
  for (const { hangul, kanji } of items){
    const hChars = Array.from(hangul);
    const kChars = Array.from(kanji);

    // 長さ一致のものだけ辞書化（列ごとに漢字候補を出すため）
    if (hChars.length !== kChars.length) continue;

    for (let i=0; i<hChars.length; i++){
      const h = hChars[i];
      const k = kChars[i];
      if (!dict.has(h)) dict.set(h, new Set());
      dict.get(h).add(k);
    }
  }
  return dict;
}

function updateStat(){
  $("#statPill").textContent =
    `items=${state.items.length} / dict=${state.dict.size} / ok=${state.score.ok} ng=${state.score.ng}`;
}

function sampleOne(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr){
  for (let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function nextQuestion(){
  if (state.items.length === 0){
    renderEmptyTable("CSVが空です。右のCSVを入力して「CSVを適用」してください。");
    return;
  }
  state.current = sampleOne(state.items);
  state.picked = Array.from(state.current.hangul).map(() => null);
  state.judging = false;
  renderTable();
  hideResult();
}

function renderEmptyTable(msg){
  const t = $("#quizTable");
  t.innerHTML = `
    <tr><td style="text-align:left;font-size:14px;color:#aab3d6;">${escapeHtml(msg)}</td></tr>
  `;
  $("#currentGuess").textContent = "（未選択）";
}

function renderTable(){
  const hangulChars = Array.from(state.current.hangul);
  const kanjiChars  = Array.from(state.current.kanji);
  const cols = hangulChars.length;

  // 列ごとの候補配列
  const colOptions = hangulChars.map((hChar, idx) => {
    const set = state.dict.get(hChar) || new Set([kanjiChars[idx]]);
    const opts = Array.from(set);
    shuffle(opts);
    return opts;
  });

  // 1行目（ハングル）
  let html = "<tr>";
  for (let c=0; c<cols; c++){
    html += `<td><div class="hangulCell">${escapeHtml(hangulChars[c])}</div></td>`;
  }
  html += "</tr>";

  // 2行目（候補を縦スタックで表示）
  // 横線が出ないよう「行を増やす」のではなく、1セルの中で縦に積む
  html += "<tr>";
  for (let c=0; c<cols; c++){
    const opts = colOptions[c];
    html += `<td>
      <div class="kanjiStack">
        ${opts.map(k => `
          <button class="cellBtn" data-col="${c}" data-k="${escapeAttr(k)}">${escapeHtml(k)}</button>
        `).join("")}
      </div>
    </td>`;
  }
  html += "</tr>";

  const table = $("#quizTable");
  table.innerHTML = html;

  // クリック：列ごとに1つ選択
  table.onclick = (e) => {
    const btn = e.target.closest(".cellBtn");
    if (!btn) return;

    const col = Number(btn.dataset.col);
    const k = btn.dataset.k;

    state.picked[col] = k;

    // 同じ列だけ selected を付け替え
    table.querySelectorAll(`.cellBtn[data-col="${col}"]`).forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");

    renderCurrentGuess();
    maybeAutoJudge(); // ★選択が揃ったら自動判定
  };

  renderCurrentGuess();
  updateStat();
}

function renderCurrentGuess(){
  const guess = state.picked.every(x => x)
    ? state.picked.join("")
    : state.picked.map(x => x || "＿").join("");
  $("#currentGuess").textContent = guess;
}

function maybeAutoJudge(){
  if (!state.current) return;
  if (state.judging) return;
  if (!state.picked.every(x => x)) return;

  state.judging = true;
  judgeAnswer();
}

function judgeAnswer(){
  const guess = state.picked.join("");
  const correct = state.current.kanji;

  state.score.total += 1;
  if (guess === correct){
    state.score.ok += 1;
    showResult(`正解！ ${state.current.hangul} = ${correct}`, "ok");
    updateStat();
    // 正解なら自動で次へ
    setTimeout(() => {
      state.judging = false;
      nextQuestion();
    }, 650);
  } else {
    state.score.ng += 1;
    showResult(`不正解：あなたの答え=${guess} / 正解=${correct} （${state.current.hangul}）`, "ng");
    updateStat();
    // 不正解の場合は、選び直せるように judging を解除
    // （再度全部埋まったタイミングで再判定される）
    setTimeout(() => { state.judging = false; }, 50);
  }
}

function revealAnswer(){
  if (!state.current) return;
  showResult(`答え：${state.current.hangul} = ${state.current.kanji}`, "ok");
}

function showResult(text, kind){
  const box = $("#resultBox");
  box.className = "result " + (kind || "");
  box.textContent = text;
}
function hideResult(){
  const box = $("#resultBox");
  box.className = "result";
  box.textContent = "";
  box.style.display = "none";
  box.style.display = "";
}

function resetScore(){
  state.score = { ok: 0, ng: 0, total: 0 };
  updateStat();
  showResult("スコアをリセットしました。", "ok");
}

function applyCSV(){
  const text = $("#csvInput").value;
  const items = parseCSV(text);

  state.items = items.slice();
  state.dict = buildDict(items);

  updateStat();
  nextQuestion();
}

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(s){
  return escapeHtml(s);
}

// init
$("#csvInput").value = DEFAULT_CSV;

$("#btnApplyCsv").addEventListener("click", applyCSV);
$("#btnNext").addEventListener("click", nextQuestion);
$("#btnReveal").addEventListener("click", revealAnswer);
$("#btnResetScore").addEventListener("click", resetScore);

window.addEventListener("keydown", (e) => {
  if (e.key === "Enter") nextQuestion();
  if (e.key.toLowerCase() === "r") revealAnswer();
});

// auto apply
applyCSV();
</script>
</body>
