<!doctype html>
<html lang="ja">
  <script src="quiz01-data.js"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz01 - 漢字語（韓→日）</title>
  <link rel="stylesheet" href="quiz-common.css" />
</head>

<body>
  <div class="wrap quiz-layout">
    <!-- Quiz -->
    <section class="card">
      <div class="hd">
        <div class="row">
          <strong>Quiz01 漢字語（韓→日）</strong>
          <span class="pill" id="statPill">-</span>
        </div>
        <div class="row">
          <button class="btn primary" id="btnNext">次の問題</button>
        </div>
      </div>

      <div class="bd">
        <div class="tableWrap">
          <table class="quiz" id="quizTable" aria-label="quiz table"></table>
        </div>

        <div class="answerPanel" id="answerPanel">
          <div class="feedback" id="answerFeedback"></div>
          <div class="row">
          </div>
        </div>
      </div>
    </section>

    <!-- CSV -->
    <aside class="card">
      <div class="hd">
        <div>漢字語データ</div>
        <button class="btn" id="btnApplyCsv">CSVを適用</button>
      </div>
      <div class="bd">
        <div class="filterWrap">
          <div class="small" style="margin-bottom:8px;">子音で絞り込み</div>
          <div class="filterButtons" id="filterButtons"></div>
        </div>
        <textarea id="csvInput" spellcheck="false"></textarea>
        <p class="small">
          ※ 辞書は「ハングル1文字 → 候補漢字集合」として内部生成します。
        </p>
      </div>
    </aside>
  </div>

  <div id="correctPopup" class="popupOverlay">
    <div class="popupCard ok">
      <div class="popupTitle">正解</div>
      <div class="popupText" id="correctPopupText"></div>
      <button class="btn primary popupBtn" id="btnPopupNext">次の問題</button>
    </div>
  </div>

<script>

const $ = (sel) => document.querySelector(sel);

const INITIAL_CONSONANT_FILTERS = ["ㄱ", "ㄴ", "ㄷ", "ㄹ", "ㅁ", "ㅂ", "ㅅ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];

const state = {
  dict: new Map(), // hangulChar -> Set(kanjiChar)
  allItems: [],    // { hangul, kanji }
  items: [],       // filtered items for quiz selection
  current: null,   // { hangul, kanji }
  picked: [],      // picked kanji per column index
  activeCol: null, // キーボード操作の対象列
  score: { ok: 0, ng: 0, total: 0 },
  judging: false,  // 自動判定の連打防止
  awaitingNextKey: false,
  popupVisible: false,
  filter: "all",
};

function normalizeLine(line){
  return line.replace(/\r/g, "").trim();
}

function parseCSV(text){
  const items = [];
  const lines = text.split("\n").map(normalizeLine).filter(l => l.length > 0);
  for (const line of lines){
    if (line.startsWith("#")) continue;
    const idx = line.indexOf(",");
    if (idx === -1) continue;
    const hangul = line.slice(0, idx).trim();
    const kanji  = line.slice(idx+1).trim();
    if (!hangul || !kanji) continue;
    items.push({ hangul, kanji });
  }
  return items;
}

function buildDict(items){
  const dict = new Map();
  for (const { hangul, kanji } of items){
    const hChars = Array.from(hangul);
    const kChars = Array.from(kanji);

    // 長さ一致のものだけ辞書化（列ごとに漢字候補を出すため）
    if (hChars.length !== kChars.length) continue;

    for (let i=0; i<hChars.length; i++){
      const h = hChars[i];
      const k = kChars[i];
      if (!dict.has(h)) dict.set(h, new Set());
      dict.get(h).add(k);
    }
  }
  return dict;
}

function updateStat(){
  const pill = $("#statPill");
  if (pill) {
    pill.textContent = `正解=${state.score.ok} / 不正解=${state.score.ng}`;
  }
}

function getInitialConsonant(hangulChar){
  if (!hangulChar) return null;
  const code = hangulChar.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return null;
  const index = Math.floor((code - 0xAC00) / 588);
  const initials = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  return initials[index] || null;
}

function getFilteredItems(items, filterKey){
  if (!filterKey || filterKey === "all") return items;
  return items.filter(({ hangul }) => {
    const firstChar = Array.from(hangul)[0];
    return getInitialConsonant(firstChar) === filterKey;
  });
}

function renderFilterButtons(){
  const container = $("#filterButtons");
  if (!container) return;

  const filterKeys = INITIAL_CONSONANT_FILTERS;
  const buttons = [
    `<button class="btn filterBtn ${state.filter === "all" ? "active" : ""}" data-filter="all">全て</button>`,
    ...filterKeys.map((key) => `<button class="btn filterBtn ${state.filter === key ? "active" : ""}" data-filter="${escapeAttr(key)}">${escapeHtml(key)}</button>`),
  ];

  container.innerHTML = buttons.join("");
  container.onclick = (e) => {
    const btn = e.target.closest(".filterBtn");
    if (!btn) return;
    setFilter(btn.dataset.filter);
  };
}

function setFilter(filterKey){
  state.filter = filterKey;
  state.items = getFilteredItems(state.allItems, filterKey);
  updateStat();
  nextQuestion();
}

function sampleOne(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr){
  for (let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function getDisplayedOptions(hChar, correctKanji){
  const base = Array.from(state.dict.get(hChar) || new Set([correctKanji]));
  if (!base.includes(correctKanji)) base.push(correctKanji);

  const unique = Array.from(new Set(base));
  if (unique.length <= 7){
    const opts = unique.slice();
    shuffle(opts);
    return opts;
  }

  const others = unique.filter(k => k !== correctKanji);
  shuffle(others);
  const opts = [correctKanji, ...others.slice(0, 6)];
  shuffle(opts);
  return opts;
}

function nextQuestion(){
  hideCorrectPopup();
  if (state.items.length === 0){
    renderEmptyTable("CSVが空です。右のCSVを入力して「CSVを適用」してください。");
    return;
  }
  state.current = sampleOne(state.items);
  state.picked = Array.from(state.current.hangul).map(() => null);
  state.activeCol = 0;
  state.judging = false;
  state.awaitingNextKey = false;
  renderTable();
  hideResult();
}

function renderEmptyTable(msg){
  const t = $("#quizTable");
  t.innerHTML = `
    <tr><td style="text-align:left;font-size:14px;color:#aab3d6;">${escapeHtml(msg)}</td></tr>
  `;
}

function getNextColumn(col){
  const start = col + 1;
  for (let i = start; i < state.picked.length; i++){
    if (!state.picked[i]) return i;
  }
  for (let i = 0; i < col; i++){
    if (!state.picked[i]) return i;
  }
  return col;
}

function renderTable(){
  const hangulChars = Array.from(state.current.hangul);
  const kanjiChars  = Array.from(state.current.kanji);
  const cols = hangulChars.length;

  // 列ごとの候補配列
  const colOptions = hangulChars.map((hChar, idx) => {
    const correctKanji = kanjiChars[idx];
    return getDisplayedOptions(hChar, correctKanji);
  });

  // 1行目（ハングル）
  let html = "<tr>";
  for (let c=0; c<cols; c++){
    html += `<td><div class="hangulCell">${escapeHtml(hangulChars[c])}</div></td>`;
  }
  html += "</tr>";

  // 2行目（候補を縦スタックで表示）
  // 横線が出ないよう「行を増やす」のではなく、1セルの中で縦に積む
  html += "<tr>";
  for (let c=0; c<cols; c++){
    const opts = colOptions[c];
    const filledOpts = [...opts];
    while (filledOpts.length < 7) {
      filledOpts.push("");
    }
    html += `<td>
      <div class="kanjiStack">
        ${filledOpts.map((k, idx) => {
          if (!k) {
            return `<div class="cellBtn dummy" aria-hidden="true"></div>`;
          }
          return `<button class="cellBtn" data-col="${c}" data-k="${escapeAttr(k)}">${idx + 1}. ${escapeHtml(k)}</button>`;
        }).join("")}
      </div>
    </td>`;
  }
  html += "</tr>";

  const table = $("#quizTable");
  table.innerHTML = html;

  const updateActiveColumnHighlight = () => {
    table.querySelectorAll(".cellBtn").forEach(b => b.classList.remove("active"));
    if (state.activeCol === null || state.activeCol === undefined) return;
    table.querySelectorAll(`.cellBtn[data-col="${state.activeCol}"]`).forEach(b => b.classList.add("active"));
  };

  // クリック：列ごとに1つ選択
  table.onclick = (e) => {
    const btn = e.target.closest(".cellBtn");
    if (!btn) return;

    const col = Number(btn.dataset.col);
    const k = btn.dataset.k;

    state.activeCol = col;
    state.picked[col] = k;

    // 同じ列だけ selected を付け替え
    table.querySelectorAll(`.cellBtn[data-col="${col}"]`).forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");

    const nextCol = getNextColumn(col);
    state.activeCol = nextCol;
    updateActiveColumnHighlight();

    maybeAutoJudge(); // ★選択が揃ったら自動判定
  };

  updateActiveColumnHighlight();
  updateStat();
}

function selectOptionByKey(key){
  if (!state.current) return;

  const col = state.activeCol !== null && state.activeCol !== undefined
    ? state.activeCol
    : state.picked.findIndex(v => v === null);
  if (col === -1) return;

  state.activeCol = col;
  const buttons = $("#quizTable").querySelectorAll(`.cellBtn[data-col="${col}"]`);
  const options = Array.from(buttons).map(b => b.dataset.k);
  const index = key === "0" ? 9 : Number(key) - 1;
  if (!options[index]) return;

  const k = options[index];
  state.picked[col] = k;
  buttons.forEach(b => b.classList.remove("selected"));
  buttons[index].classList.add("selected");

  const nextCol = getNextColumn(col);
  state.activeCol = nextCol;
  $("#quizTable").querySelectorAll(".cellBtn").forEach(b => b.classList.remove("active"));
  if (state.activeCol !== null && state.activeCol !== undefined) {
    $("#quizTable").querySelectorAll(`.cellBtn[data-col="${state.activeCol}"]`).forEach(b => b.classList.add("active"));
  }

  maybeAutoJudge();
}

function maybeAutoJudge(){
  if (!state.current) return;
  if (state.judging) return;
  if (!state.picked.every(x => x)) return;

  state.judging = true;
  judgeAnswer();
}

function judgeAnswer(){
  const guess = state.picked.join("");
  const correct = state.current.kanji;

  state.score.total += 1;
  if (guess === correct){
    state.score.ok += 1;
    hideResult();
    showCorrectPopup(`${state.current.hangul} = ${correct}`);
    updateStat();
    state.judging = false;
    state.awaitingNextKey = true;
  } else {
    state.score.ng += 1;
    showResult(`不正解：${guess} / 正解=${correct}`, "ng");
    updateStat();
    // 不正解の場合は、選び直せるように judging を解除
    // （再度全部埋まったタイミングで再判定される）
    setTimeout(() => { state.judging = false; }, 50);
  }
}

function showResult(text, kind){
  const panel = $("#answerPanel");
  panel.className = "answerPanel " + (kind || "");
  $("#answerFeedback").textContent = text;
}
function hideResult(){
  const panel = $("#answerPanel");
  panel.className = "answerPanel";
  $("#answerFeedback").textContent = "";
}
function showCorrectPopup(text){
  const popup = $("#correctPopup");
  const popupText = $("#correctPopupText");
  if (!popup || !popupText) return;
  popupText.textContent = text;
  popup.classList.add("show");
  popup.removeAttribute("hidden");
  state.popupVisible = true;
  state.awaitingNextKey = true;
}
function hideCorrectPopup(){
  const popup = $("#correctPopup");
  if (!popup) return;
  popup.classList.remove("show");
  popup.hidden = true;
  state.popupVisible = false;
  state.awaitingNextKey = false;
}

function closePopupAndAdvance(){
  hideCorrectPopup();
  nextQuestion();
}

function applyCSV(){
  const text = $("#csvInput").value;
  const items = parseCSV(text);

  state.allItems = items.slice();
  state.items = getFilteredItems(state.allItems, state.filter);
  state.dict = buildDict(items);

  const sampleEntries = Array.from(state.dict.entries()).slice(0, 20);
  console.log("[quiz01] generated dict sample:", sampleEntries);

  updateStat();
  nextQuestion();
}

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(s){
  return escapeHtml(s);
}

// init
$("#csvInput").value = DEFAULT_CSV;
renderFilterButtons();

$("#btnApplyCsv").addEventListener("click", applyCSV);
$("#btnNext").addEventListener("click", nextQuestion);
$("#btnPopupNext").addEventListener("click", closePopupAndAdvance);

window.addEventListener("keydown", (e) => {
  const target = e.target;
  if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) {
    return;
  }

  if (state.popupVisible && e.key === "Enter") {
    e.preventDefault();
    e.stopPropagation();
    closePopupAndAdvance();
    return;
  }

  if (state.awaitingNextKey) {
    state.awaitingNextKey = false;
    nextQuestion();
    return;
  }

  if (/^[0-9]$/.test(e.key)) {
    e.preventDefault();
    selectOptionByKey(e.key);
    return;
  }

  if (e.key === "Enter") nextQuestion();
});

// auto apply
applyCSV();
</script>
</body>
</html>
