<!doctype html>
<html lang="ja">
  <script src="quiz01-data.js"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>漢字語クイズ</title>
  <style>
    :root{
      --bg:#0b1020;
      --text:#e9ecf5;
      --muted:#aab3d6;
      --border:rgba(255,255,255,.14);
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --radius:16px;
      --ok:#26d07c;
      --ng:#ff5a7a;
      --accent:#7aa2ff;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    body{
      margin:0;
      font-family:var(--sans);
      background: radial-gradient(1200px 800px at 20% 10%, #18244d 0%, var(--bg) 60%);
      color:var(--text);
      line-height:1.5;
    }
    header{
      max-width: 980px;
      margin: 28px auto 0;
      padding: 0 16px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap: 12px;
    }
    h1{ margin:0; font-size: 20px; letter-spacing:.02em; }
    .sub{ color:var(--muted); font-size: 13px; margin-top:6px; }
    .pill{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      padding: 6px 10px;
      border-radius: 999px;
      font-family: var(--mono);
      white-space: nowrap;
    }
    .wrap{
      max-width: 980px;
      margin: 18px auto 60px;
      padding: 0 16px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
    }
    @media (max-width: 860px){ .wrap{ grid-template-columns: 1fr; } }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .hd{
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      background: rgba(0,0,0,.15);
      flex-wrap: wrap;
    }
    .card .bd{ padding: 16px; }

    .row{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items:center;
    }
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor:pointer;
      transition: transform .03s ease, background .15s ease, border-color .15s ease;
      font-size: 14px;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      border-color: rgba(122,162,255,.55);
      background: rgba(122,162,255,.18);
    }
    .btn.danger{
      border-color: rgba(255,90,122,.45);
      background: rgba(255,90,122,.15);
    }
    .kbd{
      font-family: var(--mono);
      font-size: 12px;
      border:1px solid rgba(255,255,255,.14);
      border-bottom-color: rgba(255,255,255,.25);
      background: rgba(255,255,255,.05);
      padding: 2px 6px;
      border-radius: 8px;
      color: var(--muted);
    }
    .small{ font-size: 12px; color: var(--muted); }

    /* ===== 表示：横線なし（行の境界線を消す） ===== */
    .tableWrap{
      overflow:auto;
      border: 1px dashed rgba(255,255,255,.18);
      background: rgba(0,0,0,.15);
      border-radius: 14px;
      padding: 12px;
    }
    table.quiz{
      width: 100%;
      min-width: 520px;   /* スマホは横スクロール */
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 18px 10px;  /* セル間に余白を作って“表っぽさ”を減らす */
    }
    table.quiz td{
      /* 横線/縦線の“罫線”は作らない */
      border: none;
      padding: 0;
      text-align: center;
      vertical-align: top;
      background: transparent;
    }

    /* 1行目（ハングル）だけ、カード風に */
    .hangulCell{
      font-size: 36px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(122,162,255,.10);
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }

    /* 漢字候補セル：ボタンを縦に積む */
    .kanjiStack{
      display:flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    button.cellBtn{
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 22px;
      cursor: pointer;
      text-align: center;
    }
    button.cellBtn:hover{ background: rgba(255,255,255,.08); }
    button.cellBtn.selected{
      border-color: rgba(122,162,255,.85);
      background: rgba(122,162,255,.18);
    }
    /* ===== ここまで ===== */

    .answerPanel{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      justify-content:space-between;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
    }
    .answerPanel .current{
      font-size: 22px;
      letter-spacing:.04em;
    }
    .answerPanel .muted{
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .result{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      font-size: 14px;
      display:none;
    }
    .result.ok{
      display:block;
      border-color: rgba(38,208,124,.55);
      background: rgba(38,208,124,.12);
    }
    .result.ng{
      display:block;
      border-color: rgba(255,90,122,.55);
      background: rgba(255,90,122,.12);
    }

    textarea{
      width: 100%;
      min-height: 220px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 12px;
      font-family: var(--mono);
      font-size: 12px;
      box-sizing:border-box;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>漢字語クイズ</h1>
      <div class="sub">ハングルの下に候補漢字を縦積み表示／全列の選択が揃ったら自動で正誤判定</div>
    </div>
    <div class="pill" id="statPill">-</div>
  </header>

  <div class="wrap">
    <!-- Quiz -->
    <section class="card">
      <div class="hd">
        <div class="row">
          <button class="btn primary" id="btnNext">次の問題</button>
          <button class="btn" id="btnReveal">答えを見る</button>
          <button class="btn danger" id="btnResetScore">スコアリセット</button>
        </div>
        <div class="row">
          <span class="kbd">Enter</span><span class="small">次へ</span>
          <span class="kbd">R</span><span class="small">答え</span>
        </div>
      </div>

      <div class="bd">
        <div class="tableWrap">
          <table class="quiz" id="quizTable" aria-label="quiz table"></table>
        </div>

        <div class="answerPanel">
          <div>
            <div class="muted">選択中（列ごと）</div>
            <div class="current" id="currentGuess">（未選択）</div>
          </div>
          <div class="row">
            <span class="small">※全列が埋まると自動で判定します</span>
          </div>
        </div>

        <div id="resultBox" class="result"></div>
      </div>
    </section>

    <!-- CSV -->
    <aside class="card">
      <div class="hd">
        <div>CSV（hangul,meaning）</div>
        <button class="btn" id="btnApplyCsv">CSVを適用</button>
      </div>
      <div class="bd">
        <p class="small">
          形式：<span class="kbd">가각,価格</span> のように1行1語。空行OK。先頭の <span class="kbd">#</span> 行はコメント扱い。
        </p>
        <textarea id="csvInput" spellcheck="false"></textarea>
        <p class="small">
          ※ 辞書は「ハングル1文字 → 候補漢字集合」として内部生成します。
        </p>
      </div>
    </aside>
  </div>

<script>

const $ = (sel) => document.querySelector(sel);

const state = {
  dict: new Map(), // hangulChar -> Set(kanjiChar)
  items: [],       // { hangul, kanji }
  current: null,   // { hangul, kanji }
  picked: [],      // picked kanji per column index
  score: { ok: 0, ng: 0, total: 0 },
  judging: false,  // 自動判定の連打防止
};

function normalizeLine(line){
  return line.replace(/\r/g, "").trim();
}

function parseCSV(text){
  const items = [];
  const lines = text.split("\n").map(normalizeLine).filter(l => l.length > 0);
  for (const line of lines){
    if (line.startsWith("#")) continue;
    const idx = line.indexOf(",");
    if (idx === -1) continue;
    const hangul = line.slice(0, idx).trim();
    const kanji  = line.slice(idx+1).trim();
    if (!hangul || !kanji) continue;
    items.push({ hangul, kanji });
  }
  return items;
}

function buildDict(items){
  const dict = new Map();
  for (const { hangul, kanji } of items){
    const hChars = Array.from(hangul);
    const kChars = Array.from(kanji);

    // 長さ一致のものだけ辞書化（列ごとに漢字候補を出すため）
    if (hChars.length !== kChars.length) continue;

    for (let i=0; i<hChars.length; i++){
      const h = hChars[i];
      const k = kChars[i];
      if (!dict.has(h)) dict.set(h, new Set());
      dict.get(h).add(k);
    }
  }
  return dict;
}

function updateStat(){
  $("#statPill").textContent =
    `items=${state.items.length} / dict=${state.dict.size} / ok=${state.score.ok} ng=${state.score.ng}`;
}

function sampleOne(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr){
  for (let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function nextQuestion(){
  if (state.items.length === 0){
    renderEmptyTable("CSVが空です。右のCSVを入力して「CSVを適用」してください。");
    return;
  }
  state.current = sampleOne(state.items);
  state.picked = Array.from(state.current.hangul).map(() => null);
  state.judging = false;
  renderTable();
  hideResult();
}

function renderEmptyTable(msg){
  const t = $("#quizTable");
  t.innerHTML = `
    <tr><td style="text-align:left;font-size:14px;color:#aab3d6;">${escapeHtml(msg)}</td></tr>
  `;
  $("#currentGuess").textContent = "（未選択）";
}

function renderTable(){
  const hangulChars = Array.from(state.current.hangul);
  const kanjiChars  = Array.from(state.current.kanji);
  const cols = hangulChars.length;

  // 列ごとの候補配列
  const colOptions = hangulChars.map((hChar, idx) => {
    const set = state.dict.get(hChar) || new Set([kanjiChars[idx]]);
    const opts = Array.from(set);
    shuffle(opts);
    return opts;
  });

  // 1行目（ハングル）
  let html = "<tr>";
  for (let c=0; c<cols; c++){
    html += `<td><div class="hangulCell">${escapeHtml(hangulChars[c])}</div></td>`;
  }
  html += "</tr>";

  // 2行目（候補を縦スタックで表示）
  // 横線が出ないよう「行を増やす」のではなく、1セルの中で縦に積む
  html += "<tr>";
  for (let c=0; c<cols; c++){
    const opts = colOptions[c];
    html += `<td>
      <div class="kanjiStack">
        ${opts.map(k => `
          <button class="cellBtn" data-col="${c}" data-k="${escapeAttr(k)}">${escapeHtml(k)}</button>
        `).join("")}
      </div>
    </td>`;
  }
  html += "</tr>";

  const table = $("#quizTable");
  table.innerHTML = html;

  // クリック：列ごとに1つ選択
  table.onclick = (e) => {
    const btn = e.target.closest(".cellBtn");
    if (!btn) return;

    const col = Number(btn.dataset.col);
    const k = btn.dataset.k;

    state.picked[col] = k;

    // 同じ列だけ selected を付け替え
    table.querySelectorAll(`.cellBtn[data-col="${col}"]`).forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");

    renderCurrentGuess();
    maybeAutoJudge(); // ★選択が揃ったら自動判定
  };

  renderCurrentGuess();
  updateStat();
}

function renderCurrentGuess(){
  const guess = state.picked.every(x => x)
    ? state.picked.join("")
    : state.picked.map(x => x || "＿").join("");
  $("#currentGuess").textContent = guess;
}

function maybeAutoJudge(){
  if (!state.current) return;
  if (state.judging) return;
  if (!state.picked.every(x => x)) return;

  state.judging = true;
  judgeAnswer();
}

function judgeAnswer(){
  const guess = state.picked.join("");
  const correct = state.current.kanji;

  state.score.total += 1;
  if (guess === correct){
    state.score.ok += 1;
    showResult(`正解！ ${state.current.hangul} = ${correct}`, "ok");
    updateStat();
    // 正解なら自動で次へ
    setTimeout(() => {
      state.judging = false;
      nextQuestion();
    }, 650);
  } else {
    state.score.ng += 1;
    showResult(`不正解：あなたの答え=${guess} / 正解=${correct} （${state.current.hangul}）`, "ng");
    updateStat();
    // 不正解の場合は、選び直せるように judging を解除
    // （再度全部埋まったタイミングで再判定される）
    setTimeout(() => { state.judging = false; }, 50);
  }
}

function revealAnswer(){
  if (!state.current) return;
  showResult(`答え：${state.current.hangul} = ${state.current.kanji}`, "ok");
}

function showResult(text, kind){
  const box = $("#resultBox");
  box.className = "result " + (kind || "");
  box.textContent = text;
}
function hideResult(){
  const box = $("#resultBox");
  box.className = "result";
  box.textContent = "";
  box.style.display = "none";
  box.style.display = "";
}

function resetScore(){
  state.score = { ok: 0, ng: 0, total: 0 };
  updateStat();
  showResult("スコアをリセットしました。", "ok");
}

function applyCSV(){
  const text = $("#csvInput").value;
  const items = parseCSV(text);

  state.items = items.slice();
  state.dict = buildDict(items);

  updateStat();
  nextQuestion();
}

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(s){
  return escapeHtml(s);
}

// init
$("#csvInput").value = DEFAULT_CSV;

$("#btnApplyCsv").addEventListener("click", applyCSV);
$("#btnNext").addEventListener("click", nextQuestion);
$("#btnReveal").addEventListener("click", revealAnswer);
$("#btnResetScore").addEventListener("click", resetScore);

window.addEventListener("keydown", (e) => {
  if (e.key === "Enter") nextQuestion();
  if (e.key.toLowerCase() === "r") revealAnswer();
});

// auto apply
applyCSV();
</script>
</body>
</html>
