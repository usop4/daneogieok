<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz Stats - 過去7日 OK/NG</title>
    <link rel="stylesheet" href="quiz-common.css" />
    <script src="quiz-common.js"></script>
  </head>
  <body>
    <div class="wrap">
      <section class="card">
        <div class="hd">
          <div class="row">
            <strong>Stats</strong>
          </div>
          <div class="row">
            <button class="btn primary" id="refreshBtn" type="button">更新</button>
          </div>
        </div>
        <div class="bd">
          <div class="tableWrap">
            <table class="stats-table" aria-label="daily quiz stats table">
              <thead>
                <tr>
                  <th></th>
                  <th><a class="statsQuizLink" href="quiz01.html">Quiz01</a><span class="statsSubcount" data-quiz-score="quiz01"></span></th>
                  <th><a class="statsQuizLink" href="quiz02.html">Quiz02</a><span class="statsSubcount" data-quiz-score="quiz02"></span></th>
                  <th><a class="statsQuizLink" href="quiz03.html">Quiz03</a><span class="statsSubcount" data-quiz-score="quiz03"></span></th>
                  <th><a class="statsQuizLink" href="quiz04.html">Quiz04</a><span class="statsSubcount" data-quiz-score="quiz04"></span></th>
                </tr>
              </thead>
              <tbody id="statsBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <div class="quiz-nav" aria-label="Quiz navigation">
        <a href="quiz01.html">Quiz01</a>
        <a href="quiz02.html">Quiz02</a>
        <a href="quiz03.html">Quiz03</a>
        <a href="quiz04.html">Quiz04</a>
        <a href="quiz-stats.html">Stats</a>
      </div>
    </div>

    <script>
      const quizIds = ['quiz01', 'quiz02', 'quiz03', 'quiz04'];

      function escapeHtml(value) {
        return quizCommon.escapeHtml(value);
      }

      function getStoredQuizScore(quizId) {
        try {
          const stored = JSON.parse(localStorage.getItem(`${quizId}-progress-v1`) || '{}');
          const score = stored?.score || {};
          return {
            ok: Number(score.ok) || 0,
            ng: Number(score.ng) || 0
          };
        } catch (error) {
          return { ok: 0, ng: 0 };
        }
      }

      function renderStats() {
        const rows = quizCommon.getRecentDailyQuizStats(quizIds, 7).slice().reverse();
        const tbody = document.getElementById('statsBody');
        if (!tbody) return;

        quizIds.forEach((quizId) => {
          const score = getStoredQuizScore(quizId);
          const target = document.querySelector(`[data-quiz-score="${quizId}"]`);
          if (target) target.innerHTML = `<span class="okText">${score.ok}</span> / <span class="ngText">${score.ng}</span>`;
        });

        tbody.innerHTML = rows.map((row) => {
          const dailyTotal = quizIds.reduce((total, quizId) => ({
            ok: total.ok + row.quizzes[quizId].ok,
            ng: total.ng + row.quizzes[quizId].ng
          }), { ok: 0, ng: 0 });
          const cells = quizIds.map((quizId) => {
            const result = row.quizzes[quizId] || { ok: 0, ng: 0 };
            return `<td><span class="okText">${escapeHtml(`${result.ok}`)}</span> / <span class="ngText"> ${escapeHtml(`${result.ng}`)}</span></td>`;
          }).join('');
          return `<tr><td><div>${escapeHtml(row.date)}</div><div class="dateSubcount"><span class="okText">${dailyTotal.ok}</span> / <span class="ngText">${dailyTotal.ng}</span></div></td>${cells}</tr>`;
        }).join('');
      }

      document.getElementById('refreshBtn').addEventListener('click', renderStats);
      renderStats();
    </script>
  </body>
</html>
